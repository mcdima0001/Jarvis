# Настройки ядра Jarvis. В коде нет ни одного пути и ни одного ключа.
# ${VAR} и ${VAR:-значение} подставляются из окружения и .env (секреты — только так).
#
# Настройки самих скиллов живут РЯДОМ С НИМИ: skills/<имя>/config.yaml. Так этот
# файл остаётся про ядро и не растёт с каждым новым скиллом. Переопределить
# настройку скилла централизованно можно в skills.settings ниже — то, что там,
# важнее файла скилла.

app:
  name: Jarvis
  language: ru

logging:
  # Уровня два, и это не дубль. Консоль читают глазами по ходу дела — лишние
  # строки в ней мешают. Файл читают, когда уже что-то пошло не так, и нужны
  # в нём как раз те записи, которых не ждали.
  #
  # Поэтому файл подробнее: подробности пишутся через debug и **без условий**
  # вида «если есть что показать». Ровно такое условие однажды и обнулило
  # диагностику — страница отвечала «ничего не вижу», а в логе от четырёх
  # попыток не осталось ни строки.
  level: INFO          # консоль: DEBUG | INFO | WARNING | ERROR
  file_level: DEBUG    # файл; поставь INFO, если файл растёт слишком быстро
  dir: logs
  file: jarvis.log
  console: true
  # Цвет в консоли: auto | always | never.
  #
  # auto красит только живой терминал: вывод перенаправляют как раз тогда, когда
  # собираются его читать, и управляющие последовательности там станут мусором.
  # Переменная окружения NO_COLOR тоже уважается. В файл цвет не попадает
  # никогда — там он ломает и grep, и чтение глазами.
  #
  # Красным и жёлтым — уровень; приглушённо — время, имя логгера и подробности;
  # голубым — что услышал; зелёным — что ответил. Обычные строки остаются
  # обычными: если раскрасить всё, не выделено ничего.
  color: auto
  # Как показывать время — в формате strftime. Одинаково в файле и в консоли.
  #   %d.%m.%y, %H:%M:%S   →  29.07.26, 21:36:51
  #   %Y-%m-%d %H:%M:%S    →  2026-07-29 21:36:51 (сортируется как текст)
  time_format: "%d.%m.%y, %H:%M:%S"
  # Один файл — один день: logs/jarvis-2026-07-30.log. Резать по размеру было
  # неудобно: границы файлов приходились на случайные моменты, и «покажи, что
  # было вчера» превращалось в поиск по времени внутри файла. Имя файла теперь
  # само отвечает, за какой он день, и сортировка по имени совпадает с датами.
  keep_days: 14        # сколько дней хранить; 0 — не удалять ничего

runtime:
  worker_threads: 2    # пул для блокирующих задач (Whisper, Piper)
  tool_timeout: 30.0   # предохранитель: сколько ждать ответа инструмента, сек
  # Считать, сколько процессора ест каждое звено голосового круга.
  #
  # Жалоба «ноутбук греется» сама по себе не указывает на виновного: непрерывно
  # работают сразу четыре вещи — модель имени, детектор речи, эхоподавление и
  # петлевой захват. Счётчик меряет процессорное время каждого звена **по его
  # потоку** и раз в минуту пишет сводку в лог. Сам он почти бесплатен: два
  # обращения к часам на кадр.
  #
  # Сводку можно спросить и голосом: «сколько ты ешь».
  meter: true
  meter_seconds: 60.0  # как часто писать в лог; 0 — только по команде

# Когда ассистенту уместно заговорить самому.
#
# У способности замечать и сообщать ровно одна настоящая опасность, и она не
# техническая: ассистента, который дёргает по пустякам, выключают через день.
# Поэтому речь без вопроса проходит через одну политику на всю систему.
#
# Заблокированное не выбрасывается, а придерживается и досказывается при
# следующем разговоре — тогда, когда владелец заведомо рядом и слушает.
# Потерять таким образом ничего нельзя.
#
# Сработавшие напоминания сюда не идут намеренно: их просили буквально, а
# политика — про речь, о которой не просили.
attention:
  enabled: true
  # Время тишины. Пустые строки — тишины нет. В это время говорится только
  # самое срочное, остальное ждёт утра.
  quiet_from: "23:30"
  quiet_to: "08:30"
  # Сколько молчать между репликами без вопроса, сек.
  min_gap_s: 60.0
  # Через сколько секунд та же самая реплика перестаёт считаться повтором.
  repeat_after_s: 600.0

skills:
  paths:
    - skills          # положил файл сюда — скилл заработает без правки ядра
  disabled: []        # имена скиллов, которые не грузить
  settings: {}       # переопределения настроек скиллов; обычно пусто
  # Настройки каждого скилла переехали к нему: skills/<имя>/config.yaml.
  # Так главный конфиг остаётся про ядро, а не растёт с каждым скиллом.
  # Что указано в settings выше — переопределяет файл скилла (main важнее).
router:
  confidence_threshold: 0.6   # ниже порога — резолвер не считается сработавшим
  resolvers:                  # порядок важен: LLM вызывается только последней
    - phrase
    - alias
    - verbatim                # «впиши …» → весь хвост дословно, мимо шаблонов
    - learned                 # формулировки, выученные из удачных разборов
    - llm
    - fallback
  # Запоминать формулировки, которые модель разобрала удачно: со второго раза
  # такая фраза обходится без модели, то есть бесплатно и мгновенно. Пишется
  # только то, что сработало, — раздел памяти `commands`. Не то, что нужно, —
  # скажи «не сохраняй в память», и последняя запись отменится.
  learn_commands: true
  # Ручные синонимы: фраза -> имя инструмента. Здесь были «погромче» и
  # «потише», ведущие на system.volume_up — инструмента с таким именем в
  # проекте никогда не существовало, и обе команды молча уходили в LLM.
  # Теперь громкостью занимается скилл windows, а фразы объявлены прямо в нём.
  aliases: {}
  # Чем разбирать команду, которую не узнали фразы. По порядку: сначала
  # дешёвая модель, и только если она инструмента НЕ выбрала — та, что умнее.
  # Дешёвая ошибается в одну сторону: отказывается выбирать, и реплика уходит в
  # свободный разговор — то есть деньги всё равно тратятся, а команда не
  # выполняется. Оставить одну задачу — переспрашивать не будет.
  intent_tasks: [intent, intent_strong]
  # Дословный захват: после этих слов остаток реплики уходит в инструмент как
  # есть, мимо шаблонов и модели. Нужно для диктовки: её аргумент — свободная
  # речь с запятыми и точками, и разбор её резал (см. keys.type_text).
  verbatim:
    - tool: keys.type_text
      arg: text
      words: [впиши, набери, напечатай, введи, надиктуй, продиктуй, type]
  # Рассказывать ли модели, что происходит сейчас: время, включённые режимы,
  # открытый сайт, прошлая команда. Без этого она разбирает фразу вслепую и не
  # может рассуждать «просят тише — значит про музыку, а не про громкость
  # системы». Стоит около сотни токенов поверх каталога в 2400, то есть
  # считанные проценты, — но выключатель есть, потому что платит владелец.
  situation: true
  # Помнить ли недавние реплики разговора — свои и владельца.
  #
  # Без этого каждая фраза разбирается с чистого листа, и видно это на самом
  # обидном случае: ассистент спрашивает «а что написать Роме?», владелец
  # отвечает — и ответ уходит в роутер новой командой ниоткуда, потому что про
  # свой вопрос ассистент уже не помнит (живой запуск 12.09.2026).
  #
  # В подсказку разбора идёт одна строка — что ассистент сказал последним;
  # полная история только в свободный разговор, где она и нужна. Разговор
  # стареет сам: после пяти минут молчания он считается законченным.
  #
  # Выключатель есть по двум причинам сразу: за историю платят токенами, и она
  # уезжает в облако вместе с вопросом.
  dialogue: true
  # Сколько последних реплик держать, считая обе стороны. Шесть — это три
  # обмена: ровно то, на что ссылаются словами «а теперь», «нет, другому».
  dialogue_turns: 6

llm:
  default_task: dialog
  providers:
    openrouter:
      type: openrouter
      api_key: ${JARVIS_OPENROUTER_KEY:-}
      base_url: https://openrouter.ai/api/v1
      timeout: 60.0
      headers:                # OpenRouter просит их для статистики; необязательны
        HTTP-Referer: https://github.com/mcdima0001/Jarvis
        X-Title: Jarvis
  # Разные модели под разные задачи. Меняются на лету: llm.set_model("code", "...")
  # Точные идентификаторы смотри на https://openrouter.ai/models — они бывают
  # неочевидны: у Anthropic это claude-haiku-4.5 через ТОЧКУ, а не через дефис.
  #
  # Расход считается сам и виден в логе после каждого запроса, целиком — по
  # команде «сколько потрачено». Дороже всего обходится intent: он срабатывает
  # на каждой фразе, которую не узнали фразы и синонимы, и тащит с собой каталог
  # инструментов (около 1500 токенов, замерено). Поэтому здесь самая дешёвая
  # экономить лучше всего, добавляя фразы в скиллы — до модели они не доходят.
  #
  # Цены за миллион токенов на 28.07.2026, вход/выход:
  #   qwen/qwen3.7-flash            0.03 / 0.13   — дёшево, поддерживает вызовы
  #   google/gemini-2.5-flash-lite  0.10 / 0.40   — надёжнее на разборе команд
  #   google/gemini-2.5-flash       0.30 / 2.50
  #   anthropic/claude-haiku-4.5    1.00 / 5.00
  #   anthropic/claude-sonnet-5     2.00 / 10.00  — было здесь раньше
  profiles:
    dialog:
      provider: openrouter
      model: google/gemini-2.5-flash
      temperature: 0.7
      # Ответ произносится вслух: длинный никто не дослушает, а выход стоит
      # в разы дороже входа. 1024 токена тут были запасом впустую.
      max_tokens: 300
    code:
      provider: openrouter
      model: anthropic/claude-sonnet-5
      temperature: 0.2
      max_tokens: 4096
    summarize:
      provider: openrouter
      model: google/gemini-2.5-flash-lite
      temperature: 0.3
      max_tokens: 300
    intent:                   # самая частая и потому самая дорогая задача
      provider: openrouter
      model: google/gemini-2.5-flash-lite
      temperature: 0.0
      max_tokens: 200
    # Вторая попытка разобрать команду, когда дешёвая модель инструмента не
    # выбрала. Платим только за неудачные разборы, а они и так стоили денег:
    # реплика всё равно уходила в разговор, то есть в модель, но без дела.
    intent_strong:
      provider: openrouter
      model: google/gemini-2.5-flash
      temperature: 0.0
      max_tokens: 200
    analysis:
      provider: openrouter
      model: google/gemini-2.5-flash
      temperature: 0.4
      max_tokens: 1024
    # Агентный цикл: составная просьба, где следующий шаг зависит от результата
    # предыдущего (`core.plan`). Модель обязана уметь вызовы инструментов, и
    # дешёвая тут не годится: ошибка в середине плана дороже ошибки в разборе
    # одной фразы, потому что за ней уже есть выполненные шаги.
    #
    # Каждый виток тащит каталог, то есть около полутора тысяч входных токенов
    # (замерено 11.09.2026). Предел шагов (MAX_STEPS в jarvis/core/agent.py) —
    # это и есть то, что удерживает счёт от разбега. Живой замер плана из двух
    # шагов: 4.3 с, три запроса, 4815 токенов, $0.0015.
    plan:
      provider: openrouter
      model: google/gemini-2.5-flash
      temperature: 0.0
      max_tokens: 400
    # Зрение: снимок экрана плюс вопрос о нём (скилл `screen`).
    # Модель обязана уметь картинки — это не та же модель, что разбирает
    # команды, поэтому профиль отдельный. Температура низкая: с экрана читают
    # факты, выдумывать тут нечего. Потолок ответа общий для всего, что
    # произносится вслух.
    vision:
      provider: openrouter
      model: google/gemini-2.5-flash
      temperature: 0.1
      max_tokens: 300

stt:
  # deepgram — облако: отвечает за доли секунды и не занимает процессор.
  #            Whisper на этом ноутбуке работает медленнее реального времени
  #            («распознано 5.3 с речи за 6.5 с», очередь переполнялась), и
  #            это был главный тормоз всей системы.
  # faster-whisper — местная модель: медленно, зато без сети и без счёта.
  # null — не распознавать вовсе.
  engine: deepgram
  # Куда откатываться, когда основного пути нет: пропала сеть, кончился лимит,
  # лёг сервис. Местная модель поднимается **лениво**, при первом же отказе:
  # держать её загруженной всегда значило бы потерять то, ради чего облако и
  # затевалось. Плата — первая фраза после обрыва, пока модель грузится.
  fallback: faster-whisper
  # Ключ: https://console.deepgram.com — в .env, сюда только ссылка.
  api_key: ${JARVIS_DEEPGRAM_KEY:-}
  # Ждать ответ недолго: лучше через несколько секунд ответить местной
  # моделью, чем через полминуты не ответить вовсе.
  timeout: 10.0
  # Для deepgram — имя облачной модели (nova-3 понимает русский и умеет
  # code-switching при language: auto). Для faster-whisper — размер местной:
  # tiny | base | small | medium | large-v3, где small — разумный компромисс.
  model: nova-3
  # auto | cpu | cuda. Whisper считает только на CUDA, то есть на NVIDIA:
  # встроенная графика Intel и карты AMD ему недоступны, и auto честно уходит
  # на процессор. На этой машине видеокарты для расчётов нет — Intel UHD.
  device: auto
  compute_type: auto       # auto = float16 на GPU, int8 на CPU
  # auto — определять язык каждой фразы; можно жёстко задать ru или en.
  language: auto
  languages: [ru, en]      # что допускаем при auto
  # Слова, которые облако должно ждать (keyterm у Deepgram). То же, что
  # initial_prompt у Whisper, только для облака.
  #
  # Нужно из-за имени. При language: auto модель ищет слово сразу в двух
  # языках, и «Джарвис» уходит в латиницу: в живом логе 11.09.2026 он приходил
  # как «Darles», «Harvest», «Чарльз», «Jarda», и после такого начала роутер
  # получал команду с мусором впереди. Замер на одной фразе: без подсказки
  # «Jarvis», с подсказкой «Джарвис». Отказываться ради этого от второго языка
  # не пришлось.
  #
  # Сюда же имеет смысл дописывать всё, что произносят и что модель коверкает:
  # названия программ, имена в чатах, свои словечки.
  keyterms:
    - Джарвис
    - AyuGram
    - OBS
  # Порог уверенности. Автоопределение на коротких фразах врёт: одиночное
  # «Джарвис» относится к английскому с уверенностью 0.27. Ниже порога берём
  # основной язык.
  language_min_probability: 0.6
  fallback_language: ru
  beam_size: 1             # 1 = максимальная скорость
  # Тишину и не-речь выбрасывает Silero ещё до модели. На процессоре это
  # главный рычаг: без него распознавание жуёт звук из колонок наравне с
  # командами и не успевает за живой речью.
  vad_filter: true
  # Сколько потоков отдать Whisper. 0 — на усмотрение ctranslate2 (обычно
  # четыре). Больше числа физических ядер ставить бессмысленно: потоки начнут
  # мешать друг другу.
  cpu_threads: 0
  models_dir: models/whisper
  # Подсказка словаря по языкам. Без неё Whisper слышит «жаркость» вместо
  # «Джарвис»: имя редкое и не входит в обычный словарь.
  # Сюда же дописываются названия, которые Whisper коверкает: «GitHub» он
  # слышал как «Geed Hub», «Geat Hub» и «гитхап», и никакое нечёткое сравнение
  # такое не вытянет. Лечится именно здесь — на слое распознавания.
  # Сюда же дописываются **названия групп и треков**, которые слушаешь:
  # «Аскорбинку» Whisper слышал как «о скорбинках» и «Ask Karbin» — два
  # разных написания за минуту, и ни одно не ищется. Чинить это подбором на
  # стороне сайта бесполезно: в поиск уезжает то, что услышали.
  initial_prompt:
    ru: "Джарвис, ассистент студии. Steam, OBS, XLR, ESP32, GitHub, YouTube,
         Google, Яндекс, Telegram, Twitch, Soundpad, FL Studio.
         Музыка: Аскорбинка, Лололошка."
    en: "Jarvis, the studio assistant. Steam, OBS, XLR, ESP32, GitHub, YouTube,
         Google, Yandex, Telegram, Twitch, Soundpad, FL Studio."

tts:
  engine: piper            # движок по умолчанию, если в voices нет префикса
  # Ключ облачного синтеза Fish Audio: https://fish.audio/go-api
  # Нужен только движку fish; пусто — работают местные голоса.
  api_key: ${JARVIS_FISH_KEY:-}
  # Имя облачной модели. Fish берёт её из **заголовка** запроса, а не из тела:
  # положенную в тело они молча игнорируют, и это их же предупреждение.
  #
  # `s2.1-pro-free` — бесплатная под fair use, ей и работаем. Платные (`s1`,
  # `s2-pro`, `s2.1-pro`) требуют отдельного API-кредита: он считается **не** тем
  # же счётом, что кредит платформы, и без пополнения отвечают 402.
  model: s2.1-pro-free
  timeout: 30.0
  # Готовые реплики: одно и то же не синтезируется дважды. Ассистент повторяется
  # по многу раз за вечер («Слушаю внимательно, сэр», «Готово», «Пауза»), и
  # каждая такая реплика стоит либо секунды и сетевого круга у облака, либо
  # работы процессора у местного движка. Из кеша она берётся мгновенно и
  # переживает перезапуск — а это как раз момент, когда ничего не прогрето.
  #
  # Кешируется только короткое: ответ поиска или разговора не повторится
  # никогда и осел бы в кеше мусором. Пусто — не кешировать вовсе.
  cache_dir: models/tts-cache
  # Движок и голос на каждый язык: пишется как движок:голос.
  #   edge   — нейроголоса Microsoft, считаются в облаке: звучат естественнее
  #            всего локального. Ключ не нужен, но нужен интернет и ~1 с на фразу
  #   kokoro — 24 кГц локально, британские мужские голоса, быстро
  #   vosk   — 22 кГц локально, русский: интонацию ставит BERT по смыслу фразы,
  #            из локальных звучит живее всех. Модель 750 МБ, грузится при старте
  #   silero — 48 кГц локально, русский
  #   xtts   — любой голос с образца, на любом языке (тяжёлый, ~1.8 ГБ)
  #   piper  — самый лёгкий и быстрый, 22 кГц
  #   fish   — облако Fish Audio: грузить нечего, поэтому запуск мгновенный.
  #            Взят **на время работы над проектом**: местный vosk поднимает
  #            модель на 750 МБ полторы минуты, и за вечер это складывается в
  #            часы ожидания. Закончится работа — вернуть vosk одной строкой.
  #            Голос пишется идентификатором из библиотеки: fish:<reference_id>
  # Послушать и выбрать:
  #   python -m jarvis --try-voice vosk     # русские дикторы Vosk
  #   python -m jarvis --try-voice cloud    # облачные нейроголоса
  #   python -m jarvis --try-voice jarvis   # британские локальные
  #   python -m jarvis --download-voice     # полный список
  voices:
    # Облачный голос Fish на время работы над проектом (07.09.2026). Выбран
    # владельцем: https://fish.audio/m/3fc339d7c6474b11a221708e2a7b1c4b
    # Причина не в качестве — vosk:male_1 устраивает и остаётся запасным, —
    # а во времени запуска: Vosk грузит 750 МБ полторы минуты, и за вечер
    # правок это часы ожидания. Обратно — раскомментировать строку ниже.
    ru: fish:3fc339d7c6474b11a221708e2a7b1c4b
    # ru: vosk:male_1
    # Был xtts:male_1 — вернул обычный движок: XTTS на процессоре подвешивает
    # первую же английскую реплику. Если появится CUDA, ставь его обратно.
    en: kokoro:bm_george
  # Чем говорить, когда основной голос отказал: нет сети, кончился тариф, лёг
  # сервис. С облачным синтезом без этого ассистент немеет целиком — и не может
  # даже сказать, что случилось.
  #
  # Kokoro тут потому, что он местный и лёгкий: грузится секунды, а не полторы
  # минуты, как Vosk. Русскую реплику он прочтёт по-английски — кириллицу
  # `normalize_for_speech` переведёт латиницей, — то есть с акцентом, но
  # разборчиво. Для аварийного режима этого достаточно.
  #
  # Голос обязан быть среди voices выше: иначе он не загрузится при старте и в
  # нужный момент окажется так же недоступен, как основной.
  fallback: kokoro:bm_george
    # Один тембр на обоих языках: XTTS договаривает вставки голосом с образца.
    # Основной язык русский, поэтому эталон снимается с русского голоса:
    #   python -m jarvis --make-reference vosk:male_0
    # либо с записи живого голоса — так чище всего:
    #   python -m jarvis --make-reference мой-голос.wav
    # Затем заменить строку en на:
    #   en: xtts:male_0
    # ВАЖНО: только с видеокартой. На процессоре XTTS грузится минутами и
    # синтезирует дольше, чем длится фраза, — ассистент замолкает. Проверить:
    #   python -c "import torch; print(torch.cuda.is_available())"
  default_language: ru
  device: auto             # auto | cpu | cuda — для тяжёлых движков (XTTS)
  # Каталог общий: у каждого движка внутри свой подкаталог.
  models_dir: models
  # Твоя правка сохранена: 1.5 — речь медленнее обычной.
  # У Kokoro, Vosk и Edge скорость задаётся наоборот, ядро пересчитает само.
  length_scale: 1.2        # <1 быстрее речь, >1 медленнее
  sample_rate: 22050       # подсказка; настоящую частоту задаёт сам голос
  # Латиницу русский голос читает как кашу («OpenRouter» звучит как «об
  # англутов»), поэтому перед синтезом она переводится в русское написание.
  # Здесь можно поправить чтение своих названий; встроенный словарь уже знает
  # Телеграм, Ютуб, Стим, О-Би-Эс, ЕСП тридцать два и другие.
  pronounce:
    Ableton: Эйблтон
    Reaper: Рипер

audio:
  engine: sounddevice      # sounddevice | null (null — работа без звука)
  input_device: null       # null = по умолчанию; номер или имя из --devices
  output_device: null
  sample_rate: 16000       # Whisper работает на 16 кГц
  frame_ms: 30
  silence_ms: 800          # столько тишины считается концом фразы
  max_utterance_s: 15.0    # предохранитель от бесконечной записи
  min_utterance_ms: 300    # короче — не распознаём, это щелчок или кашель
  # Микрофон глохнет, пока Jarvis говорит, плюс этот хвост на затухание
  # колонок и реверберацию. Иначе он слышит сам себя и разбирает свою же
  # реплику как команду. Если стоите далеко от колонок — можно уменьшить.
  echo_tail_ms: 500
  # Сколько фрагментов ждут распознавания. Whisper работает примерно в
  # реальном времени, поэтому очередь длиннее означает не «успеваем больше»,
  # а «команда выполнится с опозданием». Если в логе часто «не успеваю
  # распознавать» — дело обычно не в очереди, а в посторонней речи из колонок:
  # помогают наушники или модель полегче (stt.model: base).
  pending_limit: 2
  # Через сколько секунд затянувшейся команды сказать «секунду» и продолжить.
  # Ноль выключает.
  #
  # Молчащий несколько секунд ассистент неотличим от зависшего, и человек
  # повторяет команду — а повтор уходит в роутер вторым разом и выполняется
  # дважды. Порог высокий намеренно: заполнитель занимает голос, а голос один,
  # поэтому настоящий ответ подождёт, пока он договорит. Платить этим стоит
  # только там, где пауза и так похожа на зависание: разбор моделью, зрение,
  # поиск. Команды из шаблонов до порога не доживают вовсе.
  working_after_s: 2.5
  # Короткий звук в ответ на распознанную команду: слышно, что тебя поняли,
  # ещё до того, как команда выполнится. Путь от корня проекта; пусто — молча.
  # WAV читается сам, для MP3 нужен пакет av (входит в extra edge и voices).
  activation_sound: activation.mp3
  vad:
    # energy — по громкости, silero — нейросетью, null — пропускать всё.
    # Разница видна под музыку: энергетический считает речью всё громкое, и
    # фон набивает очередь распознавания целиком. Silero отвечает на другой
    # вопрос — речь ли это, — весит 2 МБ и качается сам при первом запуске.
    engine: silero
    # Поле одно, а смысл у него разный, и это важно не перепутать при смене
    # движка: у energy это **громкость** (0 = замерить фон комнаты и выставить
    # порог самому), у silero — **вероятность речи** (0 = как в модели, 0.5).
    # Измеренный порог этой комнаты для energy — 0.0060; для silero он означал
    # бы «речь везде», поэтому при возврате на energy ставить его обратно.
    threshold: 0.5
    calibrate_seconds: 1.0   # сколько слушать фон перед калибровкой (energy)
    models_dir: models/vad
  wake_word:
    # text     — имя ищется в расшифровке Whisper. Дёшево и работает, но имя
    #            узнаётся уже после фразы, и в шуме Whisper врёт как раз на нём.
    # acoustic — имя ловится по звуку за доли секунды, ещё до распознавания.
    #            Только так музыку успевают приглушить **до** команды, а не
    #            после. Модель качается сама при первом запуске (45 МБ); не
    #            вышло — режим молча откатывается на text.
    # none     — реагировать на любую распознанную фразу.
    mode: acoustic
    # vosk         — распознавание со словарём из одного слова: ищет «джарвис»,
    #                всё прочее складывает в «[unk]». Обучать нечего, модель
    #                русская и готовая, считает в десятки раз быстрее реального
    #                времени и поднимается за секунду.
    # openwakeword — свой классификатор, 1.2 МБ. Требует **обученной** модели:
    #                готовая `hey_jarvis` на русское «Джарвис» не отзывается
    #                вовсе (0.001 против 0.998 на английском, замер 04.09.2026).
    #                Обучение — docs/wakeword.md, нужна видеокарта NVIDIA.
    engine: vosk
    # model: models/wakeword/jarvis.onnx   # своя модель вместо скачанной
    threshold: 0.0         # порог openwakeword; 0 — как в модели (0.5)
    # Расшифровывать только то, что сказано после имени. Работает вместе с
    # mode: acoustic — без акустической модели звать было бы нечем.
    #
    # Раньше в распознавание уходила ЛЮБАЯ речь в комнате, а имя искали уже в
    # готовом тексте. Платили за это дважды: чужой разговор уезжал в облако, и
    # за него шёл счёт. Цена включения честная — промах акустической модели
    # теперь означает потерянную команду, а не лишний круг через текстовый гейт.
    recognize_after_name: true
    # Написания на всех языках, на которых зовёшь: сравнение идёт с каждым.
    phrases: [джарвис, jarvis]
    # Подстраховка: варианты, которые засчитываются как обращение.
    # Если в логе повторяется «Похоже на обращение» — допиши услышанное сюда.
    aliases: [жарвис, джарвес, жарвиз, дживс, жаркость, жарость, джаррис,
              жарис, дженнис, дженис, jervis, service]
    similarity: 0.7
    # После голого «Джарвис» ждать команду без имени. Отсчёт идёт от момента,
    # когда «Слушаю» отзвучало, а не когда фраза распозналась, — иначе треть
    # времени съедали бы собственная реплика и распознавание.
    follow_up_s: 6.0

  # Вычитание собственного звука из микрофона (AEC).
  #
  # Приглушение музыки этого не заменяет, а дополняет: оно случается **после**
  # того, как ассистента позвали, а само слово «Джарвис» произносится в полный
  # фон. AEC работает всегда и знает вычитаемое сэмпл в сэмпл — копия того, что
  # уходит на колонки, снимается прямо из системы.
  #
  # Нужен пакет: pip install -e ".[aec]". Нет его или петлевого устройства —
  # одно предупреждение при запуске, дальше всё работает как раньше.
  # Проверить на живой машине: python -m jarvis --check-aec
  aec:
    # ВЫКЛЮЧЕНО 11.09.2026 по замеру на живой машине, и это не откат идеи,
    # а следствие цифр из лога двух сеансов подряд:
    #
    #   Эхоподавление: убрано -4.4 дБ … потеряно опоры 183040 сэмплов
    #   Эхоподавление: убрано -4.7 дБ … потеряно опоры 394354 сэмплов
    #   Опора опережала микрофон на -358 мс — придержал микрофон, задержка 707 мс
    #
    # Убрано МИНУС четыре с половиной децибела: фильтр не вычитал эхо, а портил
    # сигнал. На стенде было плюс двадцать четыре, и стенд не врал — там опорный
    # сигнал идеально совпадает с микрофонным. На живой машине потоки
    # разъезжаются: опоры теряются сотнями тысяч сэмплов, выравнивание
    # пересобиралось по десять раз за сеанс, микрофон придерживался на 700 мс.
    #
    # Беда не в том, что эхо остаётся, а в том, что через этот фильтр проходит
    # ВЕСЬ звук, идущий в распознавание, — и портится он всегда, даже когда
    # музыки нет вовсе.
    #
    # Приглушение музыки на время команды (skills.settings.windows) работает и
    # остаётся: оно даёт двадцать с лишним децибел мгновенно и без обработки
    # сигнала. Включать обратно — после того, как разъезд потоков будет починен
    # и `--check-aec` покажет плюс, а не минус.
    enabled: false
    # auto — копия того, что играет на устройстве вывода по умолчанию.
    # off  — не брать вовсе (останется только срез низа).
    # Иначе — часть имени устройства вывода.
    reference: auto
    # Какой длины эхо фильтр способен описать: дорога до микрофона плюс
    # отражения комнаты. Больше — дольше сходится и дороже считать.
    tail_ms: 400
    # Давить ли спектром то, что вычесть не удалось. Это про искажения колонки
    # на большой громкости; стоит 16 мс задержки.
    residual: true
    # Срез низа, Гц. Саб на полу приходит в корпус ноутбука через стол, а не по
    # воздуху: такой путь вычесть нельзя, зато речи там нет. 0 — не срезать.
    high_pass_hz: 120

persona:
  # Манера речи: чем ассистент отвечает, когда своих слов у команды нет —
  # позвали по имени, команда выполнена, команда не вышла, запуск, остановка.
  # Варианты не повторяются подряд, полный список — в jarvis/core/persona.py.
  #
  # Обращение подставляется в фразы вместо {address}. Одна строка — на всех
  # языках; можно картой: {ru: сэр, en: sir}. Пустая строка убирает обращение
  # вместе с запятой при нём: «Слушаю, сэр.» станет «Слушаю.»
  address: сэр
  # Здороваться при запуске и прощаться при остановке. Приветствие зависит от
  # времени суток: «Доброе утро, сэр. Все системы в норме.»
  greet_on_start: true
  farewell_on_stop: true
  # Свои фразы. По умолчанию добавляются к встроенным; replace: true заменяет
  # их — но только для тех ситуаций и языков, что перечислены ниже.
  replace: false
  phrases: {}
  #   listening:        # отклик на голое «Джарвис»
  #     ru:
  #       - "К вашим услугам, {address}."
  #   done: {}          # команда выполнена молча
  #   failed: {}        # не получилось
  #   greeting: {}      # запуск; доступна подстановка {greeting}
  #   farewell: {}      # остановка

memory:
  dir: memory
  documents:               # изменяемые документы (read-modify-write)
    - profile
    - preferences
    - studio
    - projects
    - knowledge
    # Сайты: чем на каждом из них нажимают «дальше», «лайк» и всё остальное.
    # Пишет сюда скилл page, когда способ пришлось спросить у модели, — чтобы
    # второй раз за тот же вопрос не платить.
    - sites
    # Формулировки, которые модель разобрала удачно: «эти слова означают эту
    # команду». Пишет роутер, читает он же — до обращения к модели.
    - commands
    # Напоминания и таймеры. Лежат на диске, потому что обязаны пережить
    # перезапуск: «напомни через час», умершее вместе с процессом, — худший
    # вид поломки, человек-то уже понадеялся.
    - reminders
  journals:                # append-only, доступ по времени
    - today
    - history
  context_budget_tokens: 2000   # потолок на сборку контекста для LLM
