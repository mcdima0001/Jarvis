# Настройки скилла «photo_place» (где снята фотография).
# Централизованно переопределить можно в config.yaml → skills.settings.photo_place.

# Вторая глубина: место определяет агент-кодер из панели.
#
# Замер 21.09.2026 (tools/place_agent_bench.py) на десяти снимках с известными
# координатами: медиана промаха 60 метров против двух километров у обычного
# пути, восемь из десяти — ближе ста метров, с опознанием до здания. Плата —
# время: медиана три минуты, худший случай сорок семь.
#
# Поэтому глубины идут НАПЕРЕГОНКИ (замысел владельца 21.09.2026): обе
# запускаются сразу, ждём агента agent_wait_s, а не дождались — говорим то, что
# нашла зрячая модель, и досказываем позже, если агент разойдётся с названным.
agent: true
agent_url: https://jarvis.claude-work.duckdns.org
agent_key: ${CLI_CLAUDE:-}
# Какой моделью думает агент. Короткие имена (opus, sonnet) панель понимает.
agent_model: opus
# Рабочий каталог агента на стороне панели — API требует указать проект.
agent_workdir: /home/jarvis/author
# Сколько ждать агента, прежде чем ответить тем, что есть, сек.
agent_wait_s: 25
# Сколько он ещё думает в фоне после того, как ответ уже произнесён, сек.
# Дальше этого срока уточнение никому не нужно.
agent_late_s: 900
# На сколько метров ответ агента должен разойтись со сказанным, чтобы поправить
# вслух. Поправка — речь без вопроса, и ради трёхсот метров дёргать незачем.
agent_correct_m: 500

# Как снимок попадает к агенту: ноутбук раздаёт его одним файлом по случайной
# ссылке, а сервер забирает по Tailscale. Наружу раздача не видна.
#
# Пусто — адрес спрашивается у самого Tailscale (`tailscale ip -4`).
tailscale_host: ""
handoff_port: 8799
