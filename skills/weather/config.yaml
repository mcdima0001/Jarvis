# Настройки скилла «weather». Живут рядом с кодом скилла.
# Централизованно переопределить можно в config.yaml → skills.settings.weather.
# ${VAR} и ${VAR:-значение} подставляются из окружения и .env, как в главном.

# Город, если в команде он не назван. Пусто — город, где ты сейчас (скилл
# whereabouts: по IP или по месту из его настроек), и так правильнее всего:
# вписанный город врёт в поездке. Склонение ассистент разберёт сам:
# «погода в Праге» найдёт Прагу.
city: ""
# Если где ты — узнать не удалось (нет сети до сервиса, выключен whereabouts).
fallback_city: Москва
