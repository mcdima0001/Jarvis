# Настройки скилла «keys». Живут рядом с кодом скилла.
# Централизованно переопределить можно в config.yaml → skills.settings.keys.
# ${VAR} и ${VAR:-значение} подставляются из окружения и .env, как в главном.

# Клавиатурный наблюдатель: ловит набранные ключевые фразы и отвечает,
# не дожидаясь Enter. По сути вейкворд для клавиатуры.
#
# ВАЖНО про приватность. Охват — вся система (выбор владельца), значит на
# уровне ОС в короткий буфер попадает всё набранное, включая пароли до
# маскировки. От хранения защищает закрытый список триггеров ниже и
# короткий буфер: он не пишется ни на диск, ни в лог. От реакции в чужом
# месте — список skip_windows. Наружу уходит только сработавшая команда,
# тем же путём, что и сказанная вслух.
#
# Выключено по умолчанию. Включить: enabled: true. Погасить на ходу
# голосом: «перестань следить за клавиатурой».
enabled: true
# Фраза (как её печатают) → команда роутеру (что бы ты сказал вслух).
# Команда идёт через ту же цепочку резолверов, что и голос. Не делай один
# триггер началом другого («курс» и «курс рубля»): набор идёт слева
# направо, короткий сложится первым.
triggers:
  "курс рубля": "курс рубля"
  "курс доллара": "курс доллара"
  "курс евро": "курс евро"
  "какая погода": "какая погода"
# Реакции: ироничные реплики на набранные слова — чтобы был живее. Это не
# команды, ассистент говорит их сам, поэтому частоту держит политика речи
# без вопроса (пауза min_gap_s в секции attention). Список местный, наружу
# уходит только совпавшее. Выключить целиком: react: false. Дописывай своё —
# чем больше слов, тем живее; на одно слово можно несколько реплик, они идут
# по кругу. Не делай одно слово началом другого без нужды.
react: true
reactions:
  "не работает": ["Как всегда, сэр.", "Ожидаемо.", "Опять оно."]
  "не запускается": ["Классика жанра, сэр.", "Ну разумеется."]
  "почему": ["Хороший вопрос, сэр.", "Вот и я думаю."]
  "дедлайн": ["Звучит напряжённо.", "Оптимистично, сэр."]
  "устал": ["Держитесь, сэр.", "Может, перерыв?"]
  "кофе": ["Отличная идея, сэр.", "Одобряю."]
  "гений": ["Скромность украшает, сэр."]
  "не понимаю": ["Присоединяюсь, сэр.", "Мы оба, сэр."]
  "баг": ["Это не баг, сэр.", "Фича, я полагаю."]
  "ошибка": ["Бывает у лучших, сэр.", "Экспериментально."]
  "получилось": ["Поздравляю, сэр.", "Не сомневался."]
  "наконец": ["Терпение вознаграждается, сэр."]
  "сдаюсь": ["Рано, сэр.", "Ещё один заход?"]
  "переделать": ["С удовольствием, сэр.", "Ну конечно."]
  "лень": ["Понимаю, сэр.", "Кто бы говорил."]
  "гениально": ["Не буду спорить, сэр."]
  "не помню": ["Для этого есть я, сэр."]
  "срочно": ["Как обычно, сэр."]
  "завтра": ["Знакомое слово, сэр."]
  "потом": ["То есть никогда, сэр?"]
  "зависло": ["Терпение, сэр.", "Дайте ему минуту."]
  "паника": ["Спокойствие, сэр.", "Только спокойствие."]
  "идеально": ["Как и всё у вас, сэр."]
  "ненавижу": ["Сильно сказано, сэр."]
  "работает": ["Не трогайте, сэр.", "Вот и славно."]
# Пусть модель дописывает реплики к списку выше — сама, по ходу дела.
#
# Она работает ВПРОК, а не в момент срабатывания, и это принципиально. Ответ
# модели идёт полсекунды, синтез свежего текста — ещё полторы; шутка, пришедшая
# через две секунды после слова, на которое шутит, живости не добавляет вовсе.
# Поэтому сейчас звучит готовая реплика (мгновенно), а сочинённая ложится в
# оборот и прозвучит в следующий раз — тоже мгновенно, потому что к тому
# моменту уже и озвучена.
#
# Срабатывает всё так же ТОЛЬКО по словам из reactions. Цена: обращение к модели
# и то, что недавно набранное уходит в облако подсказкой. Поэтому по умолчанию
# выключено — включай осознанно. Сочинённое живёт до перезапуска и список выше
# не затирает: вытесняется только оно само, не больше четырёх реплик на слово.
react_llm: true
# Переписывать ли продиктованное («впиши …») моделью в аккуратный текст.
# Выключишь — впечатывается дословно. Разово продиктовать буквально можно и
# так: «впиши дословно …».
rewrite: true
# Сколько последних символов держать в буфере. Окно, а не архив: ровно
# чтобы поймать фразу на стыке нажатий.
window: 64
# Пауза по одному триггеру после срабатывания, сек: удержанная клавиша и
# повтор фразы иначе выстрелили бы очередью.
cooldown_seconds: 4
# Окна, где не следим вовсе (подстрока в заголовке): банки, менеджеры
# паролей. Список грубый и честно таковой остаётся — твёрдую гарантию
# даёт закрытый список триггеров, а не этот фильтр.
skip_windows: [bitwarden, keepass, 1password, lastpass, парол, password,
               банк, bank, сбербанк, тинькофф, tinkoff]
