# Настройки скилла «sentinel» (страж). Живут рядом с кодом скилла.
# Централизованно переопределить можно в config.yaml → skills.settings.sentinel.
#
# Страж сам говорит о заряде, месте на диске, долгой нагрузке и законченных
# загрузках. Говорит через общую политику речи: ночью и в «не слушаю» придержит.
# Замер каждого прохода пишется в лог (уровень DEBUG) — по нему видно, верны ли
# пороги.

# Как часто смотреть, сек.
every_s: 30
# Заряд, %: ниже low — сказать один раз, ниже critical — ещё раз и срочно.
# На зарядке всё сбрасывается.
battery_low: 20
battery_critical: 10
# Свободного места на системном диске меньше стольких гигабайт — сказать.
disk_free_gb: 10
# Процессор занят на столько процентов подряд дольше стольких минут — сказать.
cpu_busy: 90
cpu_busy_minutes: 10
# Сообщать о законченных загрузках в папке «Загрузки».
downloads: true
# Одно и то же предупреждение о диске — не чаще, чем раз в столько минут.
repeat_after_min: 60
