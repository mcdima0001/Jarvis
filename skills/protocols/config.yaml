# Настройки скилла «protocols». Живут рядом с кодом скилла.
# Централизованно переопределить можно в config.yaml → skills.settings.protocols.

# Протоколы: имя → шаги. Запуск — «протокол <имя>», список — «какие протоколы».
#
# Шаг пишется фразой, как её говорят вслух: «открой телеграм», «сделай потише».
# Разбирается шаблонами фраз, без модели. Фразу, которую шаблоны не узнали,
# протокол не угадывает — пропускает и называет в докладе. Если фраза не
# узнаётся, шаг можно записать инструментом: {tool: имя.инструмента, args: {...}}.
#
# Пример:
#   работа:
#     - открой телеграм
#     - включи трек Night City
#   отбой:
#     - поставь на паузу
#     - заблокируй компьютер
# Протокол умеет запускаться сам — по поводу. Повод пишется как «when», шаги
# возврата — как «after»:
#
#   игра:
#     when: {process: [javaw.exe]}
#     steps: [тихий режим]
#     after: [как обычно]
#
# Повод — имена процессов, а не полноэкранное окно: полный экран — признак
# обманчивый, ровно так же выглядит фильм, и протокол срабатывал бы посреди кино.
protocols:
  # Игровой режим (просьба владельца 23.09.2026). Замер того же дня, машина
  # 16.9 ГБ: Claude держит 2.03 ГБ, браузер 1.89, сам Jarvis 1.00, а телеграм —
  # 0.27, то есть полтора процента, и трогать его незачем.
  #
  # Поэтому здесь нет ни одного «закрой»: весь выигрыш сидит в двух программах,
  # полных несохранённой работы. Ассистент называет, кто сколько держит, а
  # закрывает только по прямой команде — «закрой браузер».
  игра:
    when:
      process: [javaw.exe, prismlauncher.exe, minecraft.windows.exe, cs2.exe, dota2.exe]
    steps:
      - тихий режим                        # отдать память: панель, распознавание, приоритет
      - схема питания производительность   # прежняя запомнится сама
      - что ест память                     # сказать, кто держит гигабайты
      - включи оверлей                     # счётчик кадров RivaTuner поверх игры
    after:
      - как обычно                         # вернуть приоритет и режимы
      - верни схему питания
      - выключи оверлей

# Пауза между шагами, сек: программа открывается не мгновенно.
pause_s: 0.5
# Смотреть ли за поводами и как часто, секунд. Список процессов стоит миллисекунды.
watch: true
watch_every_s: 3
