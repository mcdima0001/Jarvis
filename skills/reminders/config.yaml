# Настройки скилла «reminders». Живут рядом с кодом скилла.
# Централизованно переопределить можно в config.yaml → skills.settings.reminders.
# ${VAR} и ${VAR:-значение} подставляются из окружения и .env, как в главном.

# «Напомни через час», «поставь таймер на 10 минут». Время разбирается
# кодом, а не моделью: «через 20 минут» — не та задача, где нужна
# догадка, а ошибка тут дорогая. Не разобрали — ассистент переспросит.
#
# Как часто заглядывать в список, сек. Напоминания живут в минутах,
# поэтому десяти секунд хватает с запасом, а стоит проверка ничего.
check_seconds: 10
# Насколько опоздавшее напоминание ещё стоит произносить, часов.
# Просроченное на полсуток среди ночи скорее пугает, чем помогает;
# в лог оно попадёт в любом случае — молча терять обещанное нельзя.
late_after_h: 12
# Сколько напоминаний держать. Предел не от жадности: список зачитывают
# вслух, и полсотни — это уже не список, а наказание.
max_items: 50
