# Настройки скилла «windows». Живут рядом с кодом скилла.
# Централизованно переопределить можно в config.yaml → skills.settings.windows.
# ${VAR} и ${VAR:-значение} подставляются из окружения и .env, как в главном.

# Список программ собирается сам: меню «Пуск», рабочий стол, папки
# установки в Program Files и библиотеки Steam. Здесь только дополнения
# и свои названия: слева — как говоришь, справа — путь или имя файла.
# После установки новой программы скажи «обнови список программ».
# Справа бывает двух видов: путь (D:/Games/game.exe) или **имя другой
# программы** из каталога. Второе удобнее, когда привычное название и
# установленное разошлись: Telegram на этом ноуте не стоит, стоит форк
# AyuGram — и «открой телеграм» не находило ничего. Имя переживёт
# переустановку, а путь пришлось бы чинить каждый раз.
programs:
  телеграм: AyuGram
  телега: AyuGram
  тг: AyuGram
#   игра: D:/Games/game.exe
#   рабочий проект: D:/Projects/track.rpp
# «Закрой X» убирает окно: своя команда выхода → запрос окну (то же, что
# Alt+F4) → taskkill. «Убей X» снимает процесс сразу и принудительно.
#
# Программы из трея: для них «закрой» означает только «убери окно»,
# процесс остаётся жить намеренно. steam.exe уже в списке — без него
# перестают работать загрузки и оверлей в играх.
tray_apps: []
#   - discord.exe
# Свои команды выхода — если нужен именно полный выход по «закрой».
quit_commands: {}
#   steam.exe: "steam://exit"
# Последний способ обычного закрытия — taskkill. С /f он убивает
# намертво, без него программа успевает спросить про несохранённое.
# На «убей X» ключ /f ставится всегда, независимо от этой настройки.
force_close: false
# Приглушать чужой звук, пока Jarvis слушает команду. Микрофон ловит
# музыку наравне с голосом, а убавить её на пару секунд — двадцать
# децибел в пользу распознавания, мгновенно и без нагрузки на процессор.
# Своя громкость не трогается: ответ должно быть слышно.
# Выводить ли запущенную программу вперёд (просьба владельца 23.09.2026:
# «чтобы если он что-то запускает, оно сразу было в фокусе»). Windows сама этого
# не делает: окно, открытое не тем процессом, который сейчас в фокусе, честно
# встаёт позади. Ищем новое окно — то, которого до запуска не было, — и
# поднимаем первое появившееся. В тихом режиме («я играю») не лезем вовсе.
focus_launched: true
# Сколько ждать окно запущенной программы, секунд. Лаунчеры рисуют его не сразу.
focus_wait_s: 10

ducking:
  enabled: true
  # На сколько децибел убавлять — в зависимости от громкости системы.
  # Одной цифрой не обойтись: на 20% музыка микрофону почти не мешает, и
  # глубокий рез превратил бы её в тишину посреди трека; на 100% микрофон
  # захлёбывается, и мягкого не хватает вовсе. Между точками — по прямой.
  # Режем от той громкости, что была у приложения, а не до общей доли.
  cut_db:
    quiet: 10          # при системной громкости 20% и ниже
    loud: 35           # при 100%
  # Громкость не прыгает, а переезжает. Числа разные намеренно: убавляем
  # перед командой, и медленное затухание означало бы, что начало фразы
  # всё равно записано с музыкой; а вот возвращать резко незачем — по ушам
  # бьёт именно мгновенный скачок вверх. Ноль вернёт прежние скачки.
  fade_out_s: 0.25     # за сколько убавить
  fade_in_s: 1.2       # за сколько вернуть
  restore_delay_s: 0.5 # пауза после ответа: дать договорить и отзвучать
  restore_after_s: 20  # страховка: вернуть, даже если команды не будет
  # Видео на время реплики не приглушается, а останавливается (просьба
  # владельца 23.09.2026). Из музыки приглушение не крадёт ничего, из фильма
  # крадёт кусок — и его потом отматывают руками.
  pause_video: true
  # Кого считать видеоплеером. Пусто — список из media.py (VLC, MPC, mpv,
  # PotPlayer, «Кино и ТВ»…). Браузера там нет намеренно: во вкладке одинаково
  # бывает и фильм, и музыка, а различить их снаружи нечем.
  video_players: []
  # VLC — особый случай, и это замер, а не предубеждение (23.09.2026): окну он
  # кнопку «пауза» не отдаёт (0 из 5 чистых попыток), в системном пульте
  # мультимедиа третьей версией не показывается вовсе. Слушает он только свой
  # веб-интерфейс. Включается разово в самом VLC: Инструменты → Настройки →
  # «Все» → Интерфейс → Основные интерфейсы → «Веб», пароль — в Lua → Lua HTTP.
  # Пустой пароль означает «не настроено»: VLC тогда просто приглушается.
  vlc_http:
    url: http://127.0.0.1:8080
    password: ${VLC_HTTP_PASSWORD:-}
