# Настройки скилла «peace». Живут рядом с кодом скилла.
# Централизованно переопределить можно в config.yaml → skills.settings.peace.
# ${VAR} и ${VAR:-значение} подставляются из окружения и .env, как в главном.

# Эквалайзер Peace Nexus — своя сборка владельца. Модуль peace_api.py из этой
# папки вызывается напрямую: без MCP-сервера и без процесса на каждую команду.
api_dir: C:\Users\mcdim\PeaceBuild\nexus-api

# На сколько децибел меняет полосы одна команда «больше басов» / «меньше верхов».
step_db: 2.0
# Басы — полосы ниже этой частоты, верха — выше второй, Гц.
bass_below_hz: 250
treble_above_hz: 4000
# Дальше этого усиления полоса не поднимается и не опускается, дБ: за пределом
# звук рвёт колонку, а Peace всё равно обрезал бы значение молча.
max_gain_db: 12.0
