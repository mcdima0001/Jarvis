# Настройки скилла «relay» (прокси для ноутбука). Живут рядом с кодом скилла.
# Централизованно переопределить можно в config.yaml → skills.settings.relay.
#
# Внешние API ноута (OpenAI, Deepgram, Fish, Telegram) ходят через сервер:
# напрямую с ноута они недоступны. Включается только на серверном экземпляре —
# ноуту прокси поднимать незачем. Пускает только туннели CONNECT, только с
# адресов allow, только на порты ports и только в интернет.

enabled: false
# Где слушать. На сервере — адрес в Tailscale: снаружи прокси не виден.
host: 127.0.0.1
port: 8888
# Кого пускать: сети клиентов. 100.64.0.0/10 — все адреса Tailscale.
allow:
  - 100.64.0.0/10
# Куда можно: порты назначения. 443 — HTTPS и Telegram через HTTPS_PROXY.
ports:
  - 443
# Предел одновременных соединений: дальше — 503, а не рост памяти.
max_clients: 200
# Молчит туннель столько секунд в обе стороны — закрываем.
idle_s: 600
