# Настройки скилла «whereabouts» — где сейчас владелец.
# Централизованно переопределить можно в config.yaml → skills.settings.whereabouts.

# Место берётся у службы геолокации Windows — по сетям Wi-Fi вокруг, с
# точностью до сотни метров и независимо от VPN. Не ответила (выключена в
# «Параметры → Конфиденциальность → Расположение», нет Wi-Fi) — по IP: это
# только город, а через VPN — страна выхода.
windows_location: true

# Место, вписанное руками, важнее обоих: Wi-Fi и IP тогда не спрашиваются.
# Нужны обе координаты.
# place:
#   city: Москва
#   country: Россия
#   latitude: 55.7558
#   longitude: 37.6173

# Сколько минут верить найденному месту, прежде чем спросить снова.
cache_minutes: 30
timeout: 8
