# Настройки скилла «whereabouts» — где сейчас владелец.
# Централизованно переопределить можно в config.yaml → skills.settings.whereabouts.

# Место по умолчанию берётся по IP и само меняется в поездке. Точнее всего —
# вписать координаты дома: IP знает только город, а через VPN покажет страну
# выхода. Задано — IP не спрашивается вовсе. Нужны обе координаты.
# place:
#   city: Москва
#   country: Россия
#   latitude: 55.7558
#   longitude: 37.6173

# Сколько минут верить месту по IP, прежде чем спросить снова.
cache_minutes: 30
timeout: 8
