# Настройки скилла «search». Живут рядом с кодом скилла.
# Централизованно переопределить можно в config.yaml → skills.settings.search.
# ${VAR} и ${VAR:-значение} подставляются из окружения и .env, как в главном.

# Источники по порядку: первый непустой ответ побеждает.
#   wikipedia  — официальное API, ключа не надо, не блокирует;
#                отвечает готовой выжимкой на «кто такой» и «что такое»
#   duckduckgo — всё остальное; ключа тоже не надо, но выдача разбирается
#                из HTML и на частых запросах приходит пустой
engines: [wikipedia, duckduckgo]
max_results: 3
