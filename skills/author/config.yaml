# Настройки скилла «author». Живут рядом с кодом скилла.
# Централизованно переопределить можно в config.yaml → skills.settings.author.
# ${VAR} и ${VAR:-значение} подставляются из окружения и .env, как в главном.

# Панель, которая пишет скиллы. Работу делает агент-кодер, а не модель из
# llm.profiles: ему нужно читать, писать и проверять файлы, и на скилл у
# него уходит около минуты (замер 11.09.2026). Обычная модель выдала бы
# текст одним куском и без проверки.
url: https://jarvis.claude-work.duckdns.org
api_key: ${CLI_CLAUDE:-}
provider: claude
# Рабочий каталог агента на стороне панели. Файлы там нам не нужны —
# скилл приезжает текстом ответа, — но API требует указать проект.
workdir: /home/jarvis/author
# Минута обычно, но агент иногда себя перепроверяет.
timeout: 600
# Показать написанное свежему агенту после линтера и проверки типов.
#
# Те ловят опечатки и несуществующие имена. Они не поймают неверную
# пометку обратимости, реплику, которую нельзя произнести, или
# блокирующий вызов не в потоке — а это ровно те ошибки, что стоят
# дороже всего: они не падают, они молча работают неправильно.
#
# Смотрит отдельная сессия: спрашивать автора, хорошо ли он написал,
# бессмысленно. Стоит около полуминуты, замечания ложатся рядом с
# черновиком в review.md.
review: true
