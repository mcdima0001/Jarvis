# Настройки скилла «browser». Живут рядом с кодом скилла.
# Централизованно переопределить можно в config.yaml → skills.settings.browser.
# ${VAR} и ${VAR:-значение} подставляются из окружения и .env, как в главном.

# Ссылку открывает система, поэтому работает любой браузер по умолчанию.
# Здесь можно назвать конкретный: chrome, firefox, opera, windows-default.
# Имя должно быть известно модулю webbrowser; не найдётся — откроется
# системный, о чём будет предупреждение в логе.
browser: null
# Что открывать на голое «открой браузер».
home: https://ya.ru
# Прежде чем открывать новое окно, посмотреть, нет ли уже открытого с
# этим сайтом, и переключиться на него. Видно только активную вкладку
# каждого окна — так подписан заголовок; вкладку в глубине чужого окна
# снаружи браузера не достать. false — всегда открывать новое.
reuse: true
# Где искать, если поисковик не назван: google | yandex | duckduckgo |
# youtube | wikipedia | github | maps.
#
# Сюда же попадает «загугли»: это слово давно означает просто «поищи»,
# а не требование конкретного поисковика. Нужен именно Google — так и
# говори: «найди в гугле».
engine: yandex
# Свои поисковики: слева — как называешь, справа — шаблон с {query}.
# Запрос подставляется закодированным, поэтому кавычки и амперсанды
# внутри него безопасны.
engines: {}
#   рутрекер: "https://rutracker.org/forum/tracker.php?nm={query}"
# Расширение браузера: с ним Jarvis работает вкладками в уже открытом
# окне, а не плодит окна. Ставится распакованным из папки extension —
# инструкция в extension/README.md. Токен Jarvis пишет туда сам.
# Без расширения всё продолжает работать, только окнами.
extension:
  enabled: true
  host: 127.0.0.1     # наружу порт не открывать: это доступ к браузеру
  port: 8765
  # Сколько ждать ответа расширения, сек. Пяти не хватало: команда внутри
  # страницы честно ждёт — загрузки при переходе на поиск, появления
  # звука после нажатия, — и упиралась в «расширение не ответило».
  timeout: 12.0
  # Сколько ждать самого первого подключения, сек. Служебный поток
  # браузера просыпается по будильнику, а чаще раза в полминуты Chrome его
  # не пускает: после запуска Jarvis браузера может не быть на связи ещё
  # десяток секунд. Первая команда к странице успевала получить
  # «расширение не подключено» и уйти не туда.
  #
  # Ждём один раз за весь запуск: на машине без расширения ответ известен
  # заранее, и тормозить каждую команду незачем.
  await_ready: 15.0
  # Кому разрешено подключаться. Сравнение по началу строки:
  # идентификатор расширения меняется при переустановке, схема — нет.
  origins: ["chrome-extension://", "moz-extension://"]
# Свои сайты: «зайди на почту» откроет то, что здесь написано.
# Встроенные уже знают ютуб, гугл, яндекс, почту, гитхаб, телеграм,
# твич, стим, википедию, чат гпт, клод, реддит, карты, переводчик.
sites:
  # Веб-панель Claude Code на сервере. Написаний несколько: Whisper
  # слышит «клауд», «клод» и «cloud CLI» по-разному в каждой фразе.
  клауд сли: https://claude-work.duckdns.org
  cloud cli: https://claude-work.duckdns.org
  клод сли: https://claude-work.duckdns.org
#   работа: https://mail.yandex.ru
