# Настройки скилла «page». Живут рядом с кодом скилла.
# Централизованно переопределить можно в config.yaml → skills.settings.page.
# ${VAR} и ${VAR:-значение} подставляются из окружения и .env, как в главном.

# Что делать во вкладке: пауза, следующий трек, лайк, перемотка, нажатие
# названной кнопки. Работает только с расширением: снаружи браузера
# содержимое страницы недоступно в принципе.
#
# Спрашивать модель, если ни один известный способ не сработал. Вопрос
# задаётся один раз на сайт и действие, ответ уходит в память
# (memory.documents: sites) и дальше берётся оттуда. false — не
# спрашивать вовсе, работать только по рецептам.
learn: true
# Каким профилем спрашивать. Задача дешёвая — ответ одним числом.
llm_task: intent
# Куда идти, если открытый сайт искать не умеет (или браузер закрыт).
# «Включи трек X» — это про музыку, «включи видео X» — про ролики, и
# путать их нельзя. Названия должны быть знакомы скиллу browser.
music_site: яндекс музыка
video_site: ютуб
# Обычный шаг перемотки и громкости, если в команде число не названо.
seek_seconds: 15
volume_step: 0.1
# Свои рецепты: сайт -> действие -> варианты по порядку. Первый
# сработавший побеждает. Шаги бывают трёх видов и только трёх:
#   media: play|pause|toggle|mute|unmute|louder|quieter|forward|back
#   label: [подписи кнопок]   — сравнение краем слова, регистр не важен
#   click: [css-селекторы]
sites: {}
#   music.yandex.ru:
#     next:
#       - click: ['[data-test-id="NEXT_TRACK_BUTTON"]']
#       - label: [следующий трек]
