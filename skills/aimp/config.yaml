aimp:
  # Где AIMP держит плейлисты. Пусто — обычное место в профиле пользователя
  # (%AppData%\AIMP\PLS). Задавать стоит только при переносной сборке.
  playlists: ""

  # Насколько услышанное должно совпасть с названием трека, чтобы включить его
  # без вопроса. Ниже порога ассистент предложит выбрать из похожих.
  # Порог высокий намеренно: включить не тот трек — мелочь, но раздражающая,
  # а переспросить стоит одной реплики.
  sure: 0.72
