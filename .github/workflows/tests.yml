# Проверка на чужой машине: тесты и сборка системы.
#
# Смысл не в самих тестах — их и локально запустить недолго, — а в том, что
# гоняются они на **чистом клоне**. Ровно этого не хватало, когда шаблон
# `memory/` в .gitignore вырезал из репозитория не только каталог данных, но и
# `jarvis/core/memory/` со `skills/memory/`: локально всё работало, а свежий
# клон падал с ModuleNotFoundError. Здесь такое видно сразу и без ручной
# проверки — `actions/checkout` даёт ровно то, что лежит в git, и ничего больше.
#
# Обе платформы нужны по той же причине: код живёт на Windows у владельца и
# разбирается на Linux-сервере, а расходятся они молча — путями, кодировкой,
# доступностью пакетов.
name: тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      # Логи и docstring'и на русском, а Windows-раннер держит консоль в
      # cp1252: без этого первая же строка лога роняет процесс на
      # UnicodeEncodeError, и падение выглядит как поломка кода.
      PYTHONIOENCODING: utf-8
    strategy:
      # Падение на одной платформе не должно скрывать результат на другой:
      # разбирать интересно как раз расхождение между ними.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
          # Нижняя граница из pyproject: requires-python = ">=3.13".
          - { os: ubuntu-latest, python: "3.13" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Только базовые зависимости плюс `dev`: ни моделей, ни звуковых
      # библиотек. Всё тяжёлое в проекте необязательно и подменяется
      # заглушками — если тесты этого не подтверждают, значит заглушки сломаны,
      # и узнать об этом лучше здесь.
      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Тесты
        run: python -m pytest -q

      # Сборка системы целиком: конфиг, каталог инструментов, загрузка скиллов.
      # Тесты берут части по одной, а здесь собирается всё вместе — так ловятся
      # опечатки в config.yaml и скиллы, не пережившие правку ядра.
      - name: Сборка (--check)
        run: python -m jarvis --check
