# Обучение модели активации «Джарвис» для openWakeWord.
#
# Значения выставлены под наш случай; что менять и почему — в README.md рядом.
# Пути относительные: скрипт train.sh раскладывает всё в один рабочий каталог.

model_name: "jarvis"

# Пишется **латиницей**, и это не небрежность. Примеры произношения генерирует
# Piper моделью `en_US-libritts_r-medium` — она английская, других готовых у
# генератора нет. Нам повезло: «Джарвис» и есть английское имя, и английское
# [ˈdʒɑːrvɪs] почти совпадает с тем, как его говорят по-русски. Кириллицу сюда
# писать бесполезно: синтез прочитает её как набор букв или промолчит.
target_phrase:
  - "jarvis"

# Слова, на которые модель срабатывать не должна. Список не выдуман: это то,
# что Whisper реально слышал вместо имени (см. audio.wake_word.aliases в
# config.yaml), плюс английские соседи по звучанию.
custom_negative_phrases:
  - "service"
  - "harvest"
  - "javits"
  - "jervis"
  - "marvis"
  - "jarred"
  - "starve us"
  - "car wash"

# Сколько примеров произношения синтезировать. Двадцать тысяч — тот минимум, с
# которого авторы обещают приличное качество. Генерация линейна по времени:
# если пробный прогон покажет, что это надолго, уменьшай — но сперва прогони
# всю цепочку целиком на маленьком числе (train.sh trial).
n_samples: 20000
n_samples_val: 2000

tts_batch_size: 50
augmentation_batch_size: 16

piper_sample_generator_path: "./piper-sample-generator"
output_dir: "./jarvis_model"

rir_paths:
  - "./mit_rirs"

# Фон, с которым примеры перемешиваются. Порядок важен: ниже задаётся, сколько
# раз каждый каталог повторить.
background_paths:
  - "./audioset_16k"
  - "./music_16k"

# Своя музыка берётся втрое чаще прочего шума. Это главная настройка всего
# файла: модель учится слышать имя **поверх того, что реально играет у тебя**,
# и разница тут между «работает в тишине» и «работает дома».
background_paths_duplication_rate:
  - 1
  - 3

false_positive_validation_data_path: "./validation_set_features.npy"

augmentation_rounds: 1

feature_data_files:
  "ACAV100M_sample": "./openwakeword_features_ACAV100M_2000_hrs_16bit.npy"

batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

model_type: "dnn"
layer_size: 32

steps: 50000
max_negative_weight: 1500

# Сколько ложных срабатываний в час считать приемлемым. 0.2 — это одно
# примерно раз в пять часов; для ассистента, который слушает весь день, это
# и есть та граница, за которой он начинает раздражать.
target_false_positives_per_hour: 0.2
