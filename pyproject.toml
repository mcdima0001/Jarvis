[project]
name = "jarvis-core"
version = "0.2.0"
description = "Ядро голосового ассистента Jarvis для домашней студии"
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
tts = ["piper-tts>=1.2"]
kokoro = ["kokoro-onnx>=0.4"]
silero = ["torch>=2.0"]
vosk = ["vosk-tts>=0.3.61"]
# coqui-tts требует transformers>=4.57, но ломается на ветке 5.x:
# из неё убрали isin_mps_friendly, который импортирует слой tortoise.
xtts = ["coqui-tts>=0.27", "torch>=2.0", "torchaudio", "torchcodec",
        "transformers>=4.57,<5.0"]
edge = ["edge-tts>=6.1", "av>=11.0"]
audio = ["sounddevice>=0.4"]
# Silero VAD: детектор речи вместо энергетического. Модель качается сама,
# считает на процессоре и весит 2 МБ. onnxruntime обычно уже стоит — его
# тянет faster-whisper ради своего фильтра тишины.
vad = ["onnxruntime>=1.17", "numpy>=1.24"]
# Активация по звуку: имя слышно до распознавания. `vosk` — основной путь,
# модель русская и качается сама; обучать ничего не надо. `openwakeword` —
# запасной, для своей обученной модели (docs/wakeword.md, нужна NVIDIA):
# готовая `hey_jarvis` на русское произношение не отзывается.
wakeword = ["vosk>=0.3.45", "openwakeword>=0.6", "onnxruntime>=1.17", "numpy>=1.24"]
# Вычитание собственного звука из микрофона. `soundcard` нужен ради петлевого
# захвата: PortAudio из колеса sounddevice его не умеет — у него нет петлевых
# устройств в списке вовсе.
aec = ["soundcard>=0.4.4", "numpy>=1.24"]
# Telegram от своего аккаунта: боту чужие чаты не покажут.
telegram = ["telethon>=1.36"]
# Громкость на Windows: остальное в скилле обходится стандартной библиотекой.
windows = ["pycaw>=20230407", "comtypes>=1.2"]
voices = ["piper-tts>=1.2", "kokoro-onnx>=0.4", "torch>=2.0", "vosk-tts>=0.3.61",
          "edge-tts>=6.1", "av>=11.0"]
# numpy тут не за компанию: тесты эхоподавления считают децибелы, а не
# «работает/не работает», и без него не собираются вовсе — падают на импорте,
# а не пропускаются. «Поставил dev — тесты идут» должно быть правдой.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "numpy>=1.24", "ruff>=0.6", "mypy>=1.11"]

# Всё, что нужно живому запуску, одной строкой:
#
#     pip install -e ".[full]"
#
# Здесь намеренно **не всё подряд**, а то, что действительно работает у
# владельца. Что и почему не вошло:
#
#   torch      — тянут silero и xtts, а оба голоса отвергнуты на слух. Это
#                два гигабайта ради того, чем не пользуются;
#   xtts       — на процессоре непригоден: модель грузится минутами, первая же
#                реплика подвисает наглухо. Включать только при живой CUDA;
#   piper-tts  — голоса отвергнуты, а espeak-ng он тянет за собой;
#   edge-tts   — облачный синтез, тоже отвергнут; но `av` из этого набора нужен
#                и остаётся: без него не читается activation.mp3.
#
# Windows-пакеты помечены маркером: на Linux они просто не ставятся, и та же
# строка работает на обеих машинах.
full = [
    # Слух: распознавание, детектор речи, активация по имени.
    "faster-whisper>=1.0",
    "onnxruntime>=1.17",
    # Активация по имени: словарь из одного слова поверх русской модели.
    "vosk>=0.3.45",
    # Голос: русский и английский, плюс декодер mp3 для звука активации.
    "vosk-tts>=0.3.61",
    "kokoro-onnx>=0.4",
    "av>=11.0",
    # Звук: микрофон с колонками и петлевой захват для эхоподавления.
    "sounddevice>=0.4",
    "soundcard>=0.4.4",
    "numpy>=1.24",
    # Телеграм от своего аккаунта.
    "telethon>=1.36",
    # Громкость на Windows.
    "pycaw>=20230407; sys_platform == 'win32'",
    "comtypes>=1.2; sys_platform == 'win32'",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["py.typed"]

# Линтер. Набор правил выбран не по вкусу, а по тому, что он реально ловит в
# этом проекте: девять из первых двенадцати находок оказались **осиротевшими
# импортами**, оставшимися от правок. Ровно этот мусор в журнале граблей
# записан как признак недоделанной замены — раньше его искали глазами.
#
# Чего тут намеренно нет: стилистики. Оформление кода в проекте своё и
# сложившееся, спорить с ним линтером незачем.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",    # pyflakes: неиспользованное, недостижимое, опечатки в именах
    "E4",   # порядок импортов в файле
    "E7",   # сравнения с None/True, голые except
    "E9",   # то, что вообще не запускается
    "B",    # bugbear: изменяемые значения по умолчанию, забытый strict у zip
    "I",    # порядок и группировка импортов
]
ignore = [
    # Пустые методы в базовом классе скилла — это хуки жизненного цикла
    # (`on_setup`, `on_start`, `on_stop`), а не забытая реализация: скилл
    # переопределяет те, что ему нужны, и обязательным не является ни один.
    "B027",
]

# Проверка типов. Пакет объявляет `py.typed`, то есть обещает типизацию тем, кто
# им пользуется, — а обещание, которое никто не проверяет, живёт до первой
# правки. Строгий режим тут не включён намеренно: проект зовёт чужие библиотеки
# без типов (soundcard, vosk, telethon), и требовать аннотаций от них значит
# утонуть в заглушках.
[tool.mypy]
python_version = "3.13"
files = ["jarvis"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
