[project]
name = "jarvis-core"
version = "0.2.0"
description = "Ядро голосового ассистента Jarvis для домашней студии"
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
tts = ["piper-tts>=1.2"]
kokoro = ["kokoro-onnx>=0.4"]
silero = ["torch>=2.0"]
vosk = ["vosk-tts>=0.3.61"]
# coqui-tts требует transformers>=4.57, но ломается на ветке 5.x:
# из неё убрали isin_mps_friendly, который импортирует слой tortoise.
xtts = ["coqui-tts>=0.27", "torch>=2.0", "torchaudio", "torchcodec",
        "transformers>=4.57,<5.0"]
edge = ["edge-tts>=6.1", "av>=11.0"]
audio = ["sounddevice>=0.4"]
# Silero VAD: детектор речи вместо энергетического. Модель качается сама,
# считает на процессоре и весит 2 МБ. onnxruntime обычно уже стоит — его
# тянет faster-whisper ради своего фильтра тишины.
vad = ["onnxruntime>=1.17", "numpy>=1.24"]
# Активация по звуку: модель слышит имя до распознавания. Саму модель нужно
# обучить под своё имя и свой фон — инструкция в docs/wakeword.md.
wakeword = ["openwakeword>=0.6", "onnxruntime>=1.17", "numpy>=1.24"]
# Вычитание собственного звука из микрофона. `soundcard` нужен ради петлевого
# захвата: PortAudio из колеса sounddevice его не умеет — у него нет петлевых
# устройств в списке вовсе.
aec = ["soundcard>=0.4.4", "numpy>=1.24"]
# Telegram от своего аккаунта: боту чужие чаты не покажут.
telegram = ["telethon>=1.36"]
# Громкость на Windows: остальное в скилле обходится стандартной библиотекой.
windows = ["pycaw>=20230407", "comtypes>=1.2"]
voices = ["piper-tts>=1.2", "kokoro-onnx>=0.4", "torch>=2.0", "vosk-tts>=0.3.61",
          "edge-tts>=6.1", "av>=11.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
