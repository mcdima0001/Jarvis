[project]
name = "jarvis-core"
version = "0.1.0"
description = "Ядро голосового ассистента Jarvis для домашней студии"
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
tts = ["piper-tts>=1.2"]
audio = ["sounddevice>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
